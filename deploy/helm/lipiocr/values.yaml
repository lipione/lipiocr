image:
  api: lipiocr-api:local
  frontend: lipiocr-frontend:local

ingress:
  enabled: true
  host: lipiocr.internal.example
  basePath: /lipiocr

env:
  LIPIOCR_ENVIRONMENT: production
  LIPIOCR_API_AUTH_ENABLED: "true"
  LIPIOCR_REPOSITORY_BACKEND: sql
  LIPIOCR_STORAGE_BACKEND: s3
  LIPIOCR_OCR_PROVIDER: gemma_vision

storage:
  uploadSizeLimit: 30Mi
