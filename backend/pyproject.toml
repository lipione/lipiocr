[project]
name = "lipiocr-backend"
version = "0.1.0"
description = "Bank OCR/ICR pilot workflow API for LipiOCR"
requires-python = ">=3.9"
dependencies = [
    "alembic>=1.13,<2.0",
    "boto3>=1.34,<2.0",
    "fastapi>=0.110,<1.0",
    "httpx>=0.27,<1.0",
    "nepali-datetime>=1.0.8,<2.0",
    "psycopg[binary]>=3.1,<4.0",
    "python-multipart>=0.0.9,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.27,<1.0",
]

[project.optional-dependencies]
ocr = [
    "opencv-python-headless>=4.9,<5.0",
    "paddleocr>=2.7,<3.0",
    "pytesseract>=0.3,<1.0",
]
test = [
    "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
