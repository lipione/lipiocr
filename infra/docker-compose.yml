services:
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args:
        INSTALL_OCR_EXTRAS: ${LIPIOCR_INSTALL_OCR_EXTRAS:-false}
    container_name: lipiocr-api
    environment:
      LIPIOCR_ENVIRONMENT: ${LIPIOCR_ENVIRONMENT:-production}
      LIPIOCR_CORS_ORIGINS: ${LIPIOCR_CORS_ORIGINS:-http://localhost:3020}
      LIPIOCR_UPLOAD_DIR: /app/storage/uploads
      LIPIOCR_REPOSITORY_BACKEND: ${LIPIOCR_REPOSITORY_BACKEND:-sql}
      LIPIOCR_STORAGE_BACKEND: ${LIPIOCR_STORAGE_BACKEND:-s3}
      LIPIOCR_OCR_PROVIDER: ${LIPIOCR_OCR_PROVIDER:-gemma_vision}
      LIPIOCR_PADDLE_LANG: ${LIPIOCR_PADDLE_LANG:-en}
      LIPIOCR_GEMMA_ENABLED: ${LIPIOCR_GEMMA_ENABLED:-true}
      LIPIOCR_GEMMA_API_BASE: ${LIPIOCR_GEMMA_API_BASE:-http://host.docker.internal:8003/v1}
      LIPIOCR_GEMMA_MODEL: ${LIPIOCR_GEMMA_MODEL:-gemma-4-26b-4bit}
      LIPIOCR_GEMMA_TIMEOUT_SECONDS: ${LIPIOCR_GEMMA_TIMEOUT_SECONDS:-90}
      LIPIOCR_GEMMA_MAX_TOKENS: ${LIPIOCR_GEMMA_MAX_TOKENS:-4000}
      LIPIOCR_GEMMA_RETRIES: ${LIPIOCR_GEMMA_RETRIES:-2}
      LIPIOCR_GEMMA_REQUIRE_JSON: ${LIPIOCR_GEMMA_REQUIRE_JSON:-true}
      LIPIOCR_API_AUTH_ENABLED: ${LIPIOCR_API_AUTH_ENABLED:-true}
      LIPIOCR_API_KEYS: ${LIPIOCR_API_KEYS:?Set LIPIOCR_API_KEYS before starting LipiOCR}
      LIPIOCR_PREVIEW_TOKEN_SECRET: ${LIPIOCR_PREVIEW_TOKEN_SECRET:?Set LIPIOCR_PREVIEW_TOKEN_SECRET before starting LipiOCR}
      DATABASE_URL: postgresql://${POSTGRES_USER:-lipiocr}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting LipiOCR}@postgres:5432/${POSTGRES_DB:-lipiocr}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-lipiocr-documents}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-lipiocr}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD before starting LipiOCR}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${LIPIOCR_API_PORT:-8020}:8000"
    volumes:
      - ../storage/uploads:/app/storage/uploads
    depends_on:
      - postgres
      - redis
      - minio
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8020}
        NEXT_PUBLIC_API_PORT: ${LIPIOCR_API_PORT:-8020}
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
    container_name: lipiocr-frontend
    ports:
      - "${LIPIOCR_FRONTEND_PORT:-3020}:3000"
    depends_on:
      - api
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: lipiocr-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lipiocr}
      POSTGRES_USER: ${POSTGRES_USER:-lipiocr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting LipiOCR}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: lipiocr-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: lipiocr-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lipiocr}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD before starting LipiOCR}
    ports:
      - "${LIPIOCR_MINIO_BIND:-127.0.0.1}:9100:9000"
      - "${LIPIOCR_MINIO_BIND:-127.0.0.1}:9101:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: lipiocr-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set lipiocr http://minio:9000 ${MINIO_ROOT_USER:-lipiocr} ${MINIO_ROOT_PASSWORD:-change-me-before-production}; do
        sleep 2;
      done;
      mc mb -p lipiocr/${S3_BUCKET:-lipiocr-documents} || true;
      exit 0;
      "

volumes:
  postgres-data:
  redis-data:
  minio-data:
